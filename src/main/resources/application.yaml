spring:
  application:
    name: verkkokauppa
  datasource:
    url: jdbc:mariadb://localhost:3307/verkkokauppa
    username:
    password:
  jpa:
    hibernate:
      ddl-auto: update

      naming:
        physical-strategy=org:
          hibernate:
            boot:
              model:
                naming:
                  PhysicalNamingStrategyStandardImpl:show-sql: true

server.port: 8081